# Block a PR that adds an unsafe paid endpoint to your agent config. Strict mode.
name: inam-check-pr
on: pull_request
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: inamprotocol/inam-check@v1
        with:
          target: https://x402.coinstats.app/markets
          fail-on: caution
