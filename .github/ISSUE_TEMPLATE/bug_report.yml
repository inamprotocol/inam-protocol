name: Bug report
description: Something in the registry, SDKs, MCP server or spec behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, a request/response, or a failing test. A repro test is the fastest path to a fix (see #26).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "registry x.y.z (GET /v1/health) / inamprotocol (npm) x.y.z / spec v0.NN"
