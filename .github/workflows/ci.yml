name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-tests:
    name: Node test suite (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install root dependencies
        run: npm ci
      # Root tests import sdk-js source directly (see tsconfig.json's
      # `include`), and sdk-js is its own nested package with its own
      # dependencies (e.g. @noble/curves) — it must be installed
      # separately or root tests fail to resolve those imports.
      - name: Install sdk-js dependencies
        run: npm ci
        working-directory: sdk-js
      - name: Run tests
        run: npm test

  worker-tests:
    name: Worker test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # The Worker imports sdk-js source directly too (README: "reuses
      # sdk-js/src/crypto/ ... unchanged"), so it needs the same separate
      # install as the root node-tests job or api.test.ts fails with
      # Cannot find package '@noble/ed25519' from a Durable Object handler.
      - name: Install sdk-js dependencies
        run: npm ci
        working-directory: sdk-js
      # The hosted /mcp endpoint bundles mcp/src/readTools.ts (its zod import
      # resolves from mcp/node_modules).
      - name: Install mcp dependencies
        run: npm ci
        working-directory: mcp
      - name: Install worker dependencies
        run: npm ci
        working-directory: worker
      - name: Run tests
        run: npm test
        working-directory: worker

  python-tests:
    name: Python SDK test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package (editable) and pytest
        run: pip install -e . pytest
        working-directory: sdk-python
      - name: Run tests
        run: pytest -q
        working-directory: sdk-python

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install sdk-js dependencies
        run: npm ci
        working-directory: sdk-js
      - name: Typecheck root
        run: npx tsc --noEmit -p tsconfig.json
      - name: Install worker dependencies
        run: npm ci
        working-directory: worker
      - name: Typecheck worker
        run: npm run typecheck
        working-directory: worker

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Source-level mirrors first (no install needed), then the built pages.
      - name: Check source mirrors
        run: npm run check:versions
      - name: Build site
        run: npm ci && npm run build
        working-directory: site
      - name: Build docs-site
        run: npm ci && npm run build
        working-directory: docs-site
      - name: Check built pages
        run: npm run check:versions -- --built
