# Publish the Node reference registry image (root Dockerfile) to
# ghcr.io/inamprotocol/registry, so self-hosting (SELF-HOSTING.md) is a
# `docker run` with no clone or local build.
#
# Push to main -> tags `main` and `sha-<short>`. A `v*` tag -> its semver
# (e.g. v1.2.3 -> 1.2.3). GITHUB_TOKEN with `packages: write` is all it
# needs; no extra secret.

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/inamprotocol/registry
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
