name: action-check
# Runs the INAM check action from this checkout against the live API. Manual or when the action changes; never gates other PRs.
on:
  workflow_dispatch:
  pull_request:
    paths: ["actions/check/**", ".github/workflows/action-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: inam
        uses: ./actions/check
        with:
          target: https://x402.coinstats.app/markets
          fail-on: fail
      - run: echo "verdict ${{ steps.inam.outputs.verdict }}"
