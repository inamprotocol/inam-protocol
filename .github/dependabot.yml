# Keeps dependencies and pinned Action versions from silently drifting.
# Grouped + weekly so it's a small, reviewable PR load for a single
# maintainer, not a firehose. CI (.github/workflows/ci.yml) gates each PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directories: ["/", "/sdk-js", "/worker", "/explorer", "/site", "/docs-site"]
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /sdk-python
    schedule: { interval: weekly }
