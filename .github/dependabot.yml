# Keeps dependencies and pinned Action versions from silently drifting.
# Grouped + weekly so it's a small, reviewable PR load for a single
# maintainer, not a firehose. CI (.github/workflows/ci.yml) gates each PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directories: ["/", "/sdk-js", "/worker", "/explorer", "/site", "/docs-site", "/mcp"]
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Packages declare node >=18 and CI runs 22/24; a newer @types/node major types APIs those runtimes lack.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /sdk-python
    schedule: { interval: weekly }
