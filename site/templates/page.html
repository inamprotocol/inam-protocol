<style>
:root {
  --bg: #ffffff;
  --bg-2: #f4f5f7;
  --bg-3: #ebedf1;
  --ink: #14161b;
  --ink-dim: #4a505c;
  --ink-faint: #7b8290;
  --line: #dde1e7;
  --accent: #7a2e2e;
  --accent-ink: #632424;
  --accent-soft: #f5e8e8;
  --code-bg: #f4f5f7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0e11;
    --bg-2: #16181d;
    --bg-3: #1d2027;
    --ink: #e6e8ec;
    --ink-dim: #a2a8b5;
    --ink-faint: #6b7280;
    --line: #262a32;
    --accent: #d98686;
    --accent-ink: #e6a3a3;
    --accent-soft: #241616;
    --code-bg: #16181d;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Public Sans", -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
code, pre, kbd, .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; }
a { color: var(--accent-ink); }
a:hover { text-decoration-thickness: 2px; }
h1, h2, h3, h4 { text-wrap: balance; font-weight: 600; }
p { max-width: 72ch; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 28px; }

.topbar { border-bottom: 1px solid var(--line); background: var(--bg); }
.topbar-inner {
  max-width: 880px; margin: 0 auto; padding: 14px 28px;
  display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;
}
.wordmark {
  font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 14px;
  letter-spacing: 0.02em; color: var(--ink); text-decoration: none; white-space: nowrap;
}
.wordmark:hover { color: var(--ink); }
.topnav { display: flex; gap: 20px; flex-wrap: wrap; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.topnav a { color: var(--ink-dim); text-decoration: none; }
.topnav a:hover { color: var(--accent-ink); }
.topnav a.current { color: var(--accent-ink); }

.masthead { padding: 44px 0 8px; }
.status-line {
  font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--accent-ink);
  display: flex; align-items: center; gap: 9px; margin-bottom: 14px;
}
.status-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
h1.title { font-size: 2.1rem; margin: 0 0 14px; letter-spacing: -0.01em; }
p.lead { color: var(--ink-dim); font-size: 1.02rem; max-width: 66ch; }

section { padding: 30px 0; border-top: 1px solid var(--line); }
section:first-of-type { border-top: none; }
h2.h {
  font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px; font-weight: 600;
}
  display: flex; gap: 16px; flex-wrap: wrap;
  font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint);
  margin-bottom: 14px;
}

pre {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px;
  padding: 13px 15px; overflow-x: auto; margin: 0; font-size: 13.5px; line-height: 1.55;
}
code { font-size: 0.92em; }
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; display: block;
}

footer.site { border-top: 1px solid var(--line); margin-top: 10px; padding: 26px 0 60px; }
.footer-grid {
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px;
  font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint);
}
.footer-grid a { color: var(--ink-faint); }
.footer-grid a:hover { color: var(--accent-ink); }
article h2 { font-size: 1.35rem; margin: 2em 0 0.5em; }
article h3 { font-size: 1.1rem; margin: 1.6em 0 0.4em; }
article pre { margin: 1em 0; }
article ul, article ol { padding-left: 1.3em; max-width: 72ch; }
article li { margin: 0.25em 0; }
article blockquote { margin: 1em 0; padding: 2px 16px; border-left: 3px solid var(--accent); color: var(--ink-dim); }
.table-wrap { overflow-x: auto; margin: 1em 0; }
article table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
article th, article td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
article th { background: var(--bg-2); font-weight: 600; }
.post-meta { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }
.post-list { list-style: none; padding: 0; margin: 0; }
.post-list li { padding: 18px 0; border-top: 1px solid var(--line); }
.post-list li:first-child { border-top: none; }
.post-list a.post-title { font-size: 1.15rem; font-weight: 600; text-decoration: none; }
.post-list p { color: var(--ink-dim); margin: 6px 0; }
@media (max-width: 600px) { .wrap, .topbar-inner { padding-left: 16px; padding-right: 16px; } h1.title { font-size: 1.7rem; } }
</style>
</head>
