<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="npm run demo:x402: the honest seller is paid; an endpoint borrowing the seller's INAM ID with someone else's wallet is blocked; a newcomer with no work history is blocked">
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; white-space: pre; }
    .dim { fill: #8b949e; } .ok { fill: #3fb950; } .no { fill: #f85149; } .cmd { fill: #e6edf3; }
  </style>
  <rect width="880" height="300" rx="10" fill="#0d1117"/>
  <circle cx="22" cy="20" r="6" fill="#f85149"/><circle cx="42" cy="20" r="6" fill="#d29922"/><circle cx="62" cy="20" r="6" fill="#3fb950"/>
  <text x="20" y="58" class="cmd">$ npm run demo:x402</text>
  <text x="20" y="92">GET /forecast  <tspan class="dim">(honest seller, 1 countersigned job)</tspan></text>
  <text x="20" y="114" class="dim">   paying 0.01 USDC to 0xdbaa…5946</text>
  <text x="20" y="136" class="ok">   ✓ paid content from /forecast</text>
  <text x="20" y="170">GET /borrowed  <tspan class="dim">(claims the seller's INAM ID, payTo is someone else's wallet)</tspan></text>
  <text x="20" y="192" class="no">   ✗ not paid: payTo is not an address this INAM ID proved control of</text>
  <text x="20" y="226">GET /newcomer  <tspan class="dim">(own wallet, no work history yet)</tspan></text>
  <text x="20" y="248" class="no">   ✗ not paid: evidence none is below countersigned</text>
</svg>
